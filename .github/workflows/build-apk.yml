name: Build companion APK
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test local bridge protocol over real sockets
        run: |
          mkdir -p /tmp/hermes-protocol-test
          javac -d /tmp/hermes-protocol-test app/src/main/java/io/github/techwithrakibofficial/hermesbridge/LocalBridgeServer.java tests/LocalBridgeServerTest.java
          java -cp /tmp/hermes-protocol-test LocalBridgeServerTest
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install pinned SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile and lint
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug
      - name: Prepare phone download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Hermes-Bridge-0.2.0.apk
          cd dist
          sha256sum Hermes-Bridge-0.2.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Hermes-Bridge-APK
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Hermes-Bridge-APK
          path: dist
      - name: Publish development APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          gh release create "dev-${RUN_NUMBER}" dist/* --target "$BUILD_SHA" --prerelease --title "Hermes Bridge 0.2.0 • device test ${RUN_NUMBER}" --notes 'Development APK: explicit local bridge Start/Stop, fresh 256-bit session token, authenticated status and Home/Back only. Binds to 127.0.0.1:18765. Protocol tests use a fake action handler; actual Android/Termux integration needs phone testing. Voice controls retained. Hermes agent integration is not implemented. Debug signing may differ from earlier builds.'
