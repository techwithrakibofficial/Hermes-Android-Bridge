name: Build companion APK
on:
  push:
    branches: [main]
    paths: ['app/**', 'tests/**', '.github/workflows/build-apk.yml', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test local bridge protocol over real sockets
        run: |
          mkdir -p /tmp/hermes-protocol-test
          javac -d /tmp/hermes-protocol-test app/src/main/java/io/github/techwithrakibofficial/hermesbridge/LocalBridgeServer.java app/src/main/java/io/github/techwithrakibofficial/hermesbridge/AppCatalog.java app/src/main/java/io/github/techwithrakibofficial/hermesbridge/SnapshotLease.java tests/LocalBridgeServerTest.java tests/AppCatalogTest.java tests/SnapshotLeaseTest.java app/src/main/java/io/github/techwithrakibofficial/hermesbridge/VoiceTurnGate.java app/src/main/java/io/github/techwithrakibofficial/hermesbridge/SpeechChunks.java tests/VoiceTurnGateTest.java
          java -cp /tmp/hermes-protocol-test LocalBridgeServerTest
          java -cp /tmp/hermes-protocol-test AppCatalogTest
          java -cp /tmp/hermes-protocol-test SnapshotLeaseTest
          java -cp /tmp/hermes-protocol-test VoiceTurnGateTest
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install pinned SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore development debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hermes-development-debug-keystore-v1
      - name: Compile and lint
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug
      - name: Prepare phone download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Hermes-Bridge-0.5.0.apk
          cd dist
          sha256sum Hermes-Bridge-0.5.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Hermes-Bridge-APK
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Hermes-Bridge-APK
          path: dist
      - name: Publish development APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          gh release create "dev-${RUN_NUMBER}" dist/* --target "$BUILD_SHA" --prerelease --title "Hermes Bridge 0.5.0 • device test ${RUN_NUMBER}" --notes 'Native companion integration build 0.5.0: chat and microphone UI, foreground task/voice service with Stop, turn-taking recognition and saved TTS voice, private ACP backend with idempotent requests/approvals/cancel and session restore. Existing Telegram/cron/19 Android tools preserved. Install the matching private companion backend; current bridge pairing is required. CI fixtures do not establish real TECNO mic/voice/app workflows. See docs/UPGRADE_0_5.md and MASTER_PLAN.md.'
