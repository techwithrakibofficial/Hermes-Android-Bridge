name: Test Hermes MCP adapter
on:
  push:
    branches: [main]
    paths:
      - 'integrations/hermes_bridge/**'
      - '.github/workflows/test-adapter.yml'
  pull_request:
    paths:
      - 'integrations/hermes_bridge/**'
      - '.github/workflows/test-adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact ACP SDK used by existing Hermes
        run: python -m pip install agent-client-protocol==0.9.0
      - name: Test private pairing, loopback HTTP, MCP and real ACP SDK
        run: python -m unittest discover -s integrations/hermes_bridge -p 'test_*.py' -v
